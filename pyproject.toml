[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hw4-ml-pipeline"
version = "1.0.0"
description = "A tested CPU pipeline for tabular classification with logarithmic attention"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2,<3", "torch>=2.6,<3"]

[project.scripts]
ml-pipeline = "ml_pipeline.cli:main"

[dependency-groups]
dev = ["hypothesis>=6,<7", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "unit: isolated contracts of blocks, datasets, model and training",
    "integration: interactions between real pipeline components",
    "property: generated input invariants checked with Hypothesis",
    "regression: guards against numerical and masking defects",
    "smoke: fast check of the public training API",
    "e2e: separate process checks of the installed CLI",
]

[tool.coverage.run]
source = ["ml_pipeline"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
