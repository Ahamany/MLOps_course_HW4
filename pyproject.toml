[project]
name = "ml-pipeline"
version = "0.1.0"
description = "A tested CPU pipeline for tabular classification with logarithmic attention"
readme = "README.md"
authors = [
    { name = "Ahamany", email = "yangalinismail@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2,<3",
    "torch>=2.6,<3",
]

[project.scripts]
ml-pipeline = "ml_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.11,<1",
]

[tool.uv.build-backend]
module-name = "ml_pipeline"
module-root = "src"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
markers = [
    "unit: isolated contracts of blocks, datasets, model and training",
    "integration: interactions between real pipeline components",
    "property: generated input invariants checked with Hypothesis",
    "regression: guards against numerical and masking defects",
    "smoke: fast check of the public training API",
    "e2e: separate process checks of the installed CLI",
]

[tool.coverage.run]
source = ["ml_pipeline"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
